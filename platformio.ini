[platformio]
default_envs = esp32cam_debug

; ---- общее ----
[common]
platform = espressif32
framework = espidf
build_flags = -DBOARD_HAS_PSRAM
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder, time, log2file

; ---- AI-Thinker ESP32-CAM (4 MB flash, 4 MB PSRAM) ----
[board_esp32cam]
extends = common
board = esp32cam
board_build.partitions = partitions_4mb.csv
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.common;sdkconfig.esp32cam"

; ---- ESP32-S3 WROOM CAM (16 MB flash, 8 MB quad PSRAM) ----
[board_esp32s3cam]
extends = common
board = esp32-s3-devkitc-1
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.common;sdkconfig.esp32s3cam"

[env:esp32cam_debug]
extends = board_esp32cam
build_type = debug

[env:esp32cam_release]
extends = board_esp32cam
build_type = release

[env:esp32s3cam_debug]
extends = board_esp32s3cam
build_type = debug

[env:esp32s3cam_release]
extends = board_esp32s3cam
build_type = release
